                                        <span>{CATEGORY_ICON[categoryDetail.category] || '🔖'}</span>
                                        <span className="truncate">{categoryDetail.category}</span>
                                        <span className="text-xs font-normal text-gray-400 whitespace-nowrap">
                                            ({categoryDetail.scope === 'month' ? 'This Month' : 'All Time'})
                                        </span>
                                    </h3>
                                    <button
                                        onClick={() => setCategoryDetail(null)}
                                        className="text-gray-400 hover:text-gray-600 text-2xl leading-none px-2 flex-shrink-0"
                                    >
                                        ×
                                    </button>
                                </div>
                                <div className="overflow-y-auto p-4 space-y-2">
                                    {categoryDetailTransactions.length === 0 ? (
                                        <p className="text-gray-400 text-sm text-center py-8">No transactions found.</p>
                                    ) : (
                                        categoryDetailTransactions.map((t, i) => (
                                            <div key={t.key || i} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-semibold text-gray-800 truncate">{t.description || t.category}</div>
                                                    <div className="text-xs text-gray-500">
                                                        {t.date}
                                                        {categoryDetail.scope === 'allTime' && t.monthLabel ? ` · ${t.monthLabel}` : ''}
                                                    </div>
                                                </div>
                                                <div className="text-red-600 font-bold ml-3 flex-shrink-0">-${t.amount.toFixed(2)}</div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="p-4 border-t border-gray-100 text-sm text-gray-500 flex justify-between">
                                    <span>{categoryDetailTransactions.length} transaction{categoryDetailTransactions.length !== 1 ? 's' : ''}</span>
                                    <span className="font-semibold text-gray-700">
                                        Total: ${categoryDetailTransactions.reduce((s, t) => s + t.amount, 0).toFixed(2)}
                                    </span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Tab Bar */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_12px_rgba(0,0,0,0.08)] border-t border-gray-100 z-20">
                        <div className="max-w-2xl mx-auto flex gap-2 p-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))]">
                            {TABS.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 py-2.5 rounded-xl font-semibold text-sm transition-colors ${
                                        activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
