<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiva & Maziar's Budget</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366F1'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#6366F1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyD8bRTk1a4PVsVpPrGmMPwDWh5D9QlKPFY",
          authDomain: "budget-tracker-65260.firebaseapp.com",
          databaseURL: "https://budget-tracker-65260-default-rtdb.firebaseio.com",
          projectId: "budget-tracker-65260",
          storageBucket: "budget-tracker-65260.firebasestorage.app",
          messagingSenderId: "598252496462",
          appId: "1:598252496462:web:4f518d57c5ec905999c51f"
        };

        // Initialize Firebase
        let db = null;
        let isFirebaseConfigured = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            isFirebaseConfigured = true;
        } catch (error) {
            console.error("Firebase initialization error:", error);
        }

        // ---- Categories ----
        const CATEGORIES = [
            { name: "Walmart",       color: "#0071CE", icon: "🛒" },
            { name: "Costco",        color: "#E01A2B", icon: "📦" },
            { name: "Other Grocery", color: "#16A34A", icon: "🥦" },
            { name: "Clothing",      color: "#9333EA", icon: "👕" },
            { name: "Furniture",     color: "#78350F", icon: "🛋️" },
            { name: "Rent",          color: "#B45309", icon: "🏠" },
            { name: "Tuition",       color: "#0891B2", icon: "🎓" },
            { name: "Bills",         color: "#DC2626", icon: "🧾" },
            { name: "Fun",           color: "#DB2777", icon: "🎉" },
            { name: "Other",         color: "#6B7280", icon: "🔖" },
        ];
        const CATEGORY_GROUPS = [
            { title: "Shopping",     items: ["Walmart", "Costco", "Other Grocery", "Clothing", "Furniture"] },
            { title: "Home & Bills", items: ["Rent", "Tuition", "Bills"] },
            { title: "Lifestyle",    items: ["Fun", "Other"] },
        ];
        const CATEGORY_COLOR = Object.fromEntries(CATEGORIES.map(c => [c.name, c.color]));
        const CATEGORY_ICON = Object.fromEntries(CATEGORIES.map(c => [c.name, c.icon]));
        const CATEGORY_BY_NAME = Object.fromEntries(CATEGORIES.map(c => [c.name, c]));
        const INCOME_COLOR = "#059669";

        function objToArray(obj) {
            if (!obj) return [];
            return Object.entries(obj)
                .map(([key, val]) => ({ ...val, key }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }

        // ---- Pie chart (raw Chart.js, no wrapper lib) ----
        function PieChart({ title, dataMap, emptyLabel }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            const entries = Object.entries(dataMap).filter(([, v]) => v > 0);
            const total = entries.reduce((s, [, v]) => s + v, 0);

            useEffect(() => {
                if (!canvasRef.current) return;
                if (chartRef.current) {
                    chartRef.current.destroy();
                    chartRef.current = null;
                }
                if (entries.length === 0) return;

                chartRef.current = new Chart(canvasRef.current, {
                    type: 'pie',
                    data: {
                        labels: entries.map(([label]) => `${CATEGORY_ICON[label] || '🔖'} ${label}`),
                        datasets: [{
                            data: entries.map(([, v]) => v),
                            backgroundColor: entries.map(([label]) => CATEGORY_COLOR[label] || "#6B7280"),
                            borderWidth: 2,
                            borderColor: "#ffffff",
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 14, padding: 12, font: { size: 12 } } },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        const val = ctx.raw;
                                        const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                                        return ` ${ctx.label}: $${val.toFixed(2)} (${pct}%)`;
                                    }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                        chartRef.current = null;
                    }
                };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [JSON.stringify(dataMap)]);

            return (
                <div className="bg-white rounded-2xl shadow-lg p-6">
                    <div className="flex justify-between items-baseline mb-4">
                        <h3 className="text-lg font-bold text-gray-800">{title}</h3>
                        <span className="text-sm text-gray-500">Total: ${total.toFixed(2)}</span>
                    </div>
                    {entries.length === 0 ? (
                        <p className="text-gray-400 text-sm text-center py-12">{emptyLabel}</p>
                    ) : (
                        <div className="max-w-xs mx-auto">
                            <canvas ref={canvasRef}></canvas>
                        </div>
                    )}
                </div>
            );
        }

        function BudgetTracker() {
            const [activeTab, setActiveTab] = useState('dashboard');

            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [txType, setTxType] = useState('subtract'); // 'add' income | 'subtract' expense
            const [category, setCategory] = useState('');

            const [transactions, setTransactions] = useState([]);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('checking');
            const [syncError, setSyncError] = useState('');

            useEffect(() => {
                if (!isFirebaseConfigured) {
                    setSyncStatus('not-configured');
                    setLoading(false);
                    return;
                }
                setupRealtimeListeners();
            }, []);

            const handleDbError = (context) => (error) => {
                console.error(`Firebase error (${context}):`, error);
                setSyncStatus('error');
                setSyncError(error.message || String(error));
                setLoading(false);
            };

            const setupRealtimeListeners = () => {
                setSyncStatus('syncing');

                db.ref('budget/transactions').on('value', (snapshot) => {
                    setTransactions(objToArray(snapshot.val()));
                    setLoading(false);
                    setSyncStatus('synced');
                    setSyncError('');
                }, handleDbError('loading transactions'));

                db.ref('budget/history').on('value', (snapshot) => {
                    setHistory(objToArray(snapshot.val()));
                }, handleDbError('loading history'));
            };

            const requireDb = () => {
                if (!isFirebaseConfigured) {
                    alert('Firebase not configured. Please add your Firebase config.');
                    return false;
                }
                return true;
            };

            const handleTransaction = async () => {
                if (!requireDb()) return;
                const value = parseFloat(amount);
                if (!value || value <= 0) {
                    alert('Please enter a valid amount');
                    return;
                }
                if (txType === 'subtract' && !category) {
                    alert('Please pick a category');
                    return;
                }

                const transaction = {
                    type: txType,
                    amount: value,
                    description: description.trim(),
                    category: txType === 'add' ? 'Income' : category,
                    paid: txType === 'subtract' ? false : true,
                    date: new Date().toLocaleString(),
                    timestamp: Date.now(),
                };

                setAmount('');
                setDescription('');
                setCategory('');

                try {
                    setSyncStatus('syncing');
                    await db.ref('budget/transactions').push(transaction);
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('saving transaction')(error);
                    alert('Failed to save transaction: ' + (error.message || error));
                }
            };

            const deleteTransaction = async (key) => {
                if (!requireDb()) return;
                if (!window.confirm('Delete this transaction?')) return;
                try {
                    setSyncStatus('syncing');
                    await db.ref('budget/transactions/' + key).remove();
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('deleting transaction')(error);
                    alert('Failed to delete transaction: ' + (error.message || error));
                }
            };

            const togglePaid = async (tx) => {
                if (!requireDb()) return;
                try {
                    setSyncStatus('syncing');
                    await db.ref('budget/transactions/' + tx.key).update({ paid: !tx.paid });
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('updating paid status')(error);
                    alert('Failed to update: ' + (error.message || error));
                }
            };

            const totalIncome = useMemo(() => transactions.filter(t => t.type === 'add').reduce((s, t) => s + t.amount, 0), [transactions]);
            const totalExpenses = useMemo(() => transactions.filter(t => t.type === 'subtract').reduce((s, t) => s + t.amount, 0), [transactions]);
            const balance = totalIncome - totalExpenses;
            const unpaidTotal = useMemo(
                () => transactions.filter(t => t.type === 'subtract' && !t.paid).reduce((s, t) => s + t.amount, 0),
                [transactions]
            );

            const resetMonth = async () => {
                if (!requireDb()) return;
                if (!window.confirm('Start a new month? This will save all current data to the archive and clear your current transactions.')) return;

                const monthData = {
                    month: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
                    finalBalance: balance,
                    totalIncome,
                    totalExpenses,
                    transactions: transactions,
                    resetDate: new Date().toLocaleString(),
                    timestamp: Date.now(),
                };

                try {
                    setSyncStatus('syncing');
                    await db.ref('budget/history').push(monthData);
                    await db.ref('budget/transactions').remove();
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('archiving month')(error);
                    alert('Failed to start new month — nothing was cleared. Error: ' + (error.message || error));
                }
            };

            // ---- Chart data ----
            const monthCategoryTotals = useMemo(() => {
                const map = {};
                transactions.filter(t => t.type === 'subtract').forEach(t => {
                    map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
                });
                return map;
            }, [transactions]);

            const allTimeCategoryTotals = useMemo(() => {
                const map = {};
                transactions.filter(t => t.type === 'subtract').forEach(t => {
                    map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
                });
                history.forEach(month => {
                    (month.transactions || []).filter(t => t.type === 'subtract').forEach(t => {
                        map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
                    });
                });
                return map;
            }, [transactions, history]);

            const getSyncStatusColor = () => {
                switch (syncStatus) {
                    case 'synced': return 'text-green-600';
                    case 'syncing': return 'text-yellow-600';
                    case 'error': return 'text-red-600';
                    case 'not-configured': return 'text-orange-600';
                    default: return 'text-gray-600';
                }
            };

            const getSyncStatusText = () => {
                switch (syncStatus) {
                    case 'synced': return '✓ Synced';
                    case 'syncing': return '⟳ Syncing...';
                    case 'error': return '⚠ Sync Error';
                    case 'not-configured': return '⚠ Firebase Not Configured';
                    default: return 'Checking...';
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-xl text-gray-600">Loading...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-2xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                                <svg className="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                Shiva & Maziar's Little Budget Helper
                            </h1>
                            <div className="flex justify-between items-center">
                                <p className="text-sm text-gray-500">Tracking our finances together 💑</p>
                                <p className={`text-sm font-semibold ${getSyncStatusColor()}`}>
                                    {getSyncStatusText()}
                                </p>
                            </div>

                            {syncStatus === 'not-configured' && (
                                <div className="mt-4 p-4 bg-orange-50 border-2 border-orange-200 rounded-lg">
                                    <p className="text-sm text-orange-800 font-semibold mb-2">⚠️ Firebase Configuration Required</p>
                                    <p className="text-xs text-orange-700">
                                        Please replace the Firebase config in the HTML file with your own Firebase project credentials.
                                    </p>
                                </div>
                            )}

                            {syncStatus === 'error' && (
                                <div className="mt-4 p-4 bg-red-50 border-2 border-red-200 rounded-lg">
                                    <p className="text-sm text-red-800 font-semibold mb-1">⚠️ Sync error</p>
                                    <p className="text-xs text-red-700 break-words">{syncError}</p>
                                    <p className="text-xs text-red-700 mt-1">
                                        If this says "permission denied", your Firebase Realtime Database security rules have likely expired
                                        (test-mode rules auto-expire 30 days after the database is created). Open the Firebase console →
                                        Realtime Database → Rules, and set read/write to "true" (or your own auth-based rules) instead of a
                                        time-limited condition.
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Tabs */}
                        <div className="bg-white rounded-2xl shadow-lg p-2 mb-4 flex gap-2">
                            {[
                                { id: 'dashboard', label: '🏠 Dashboard' },
                                { id: 'charts', label: '📊 Charts' },
                                { id: 'archive', label: '📦 Archive' },
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex-1 py-2 rounded-xl font-semibold text-sm transition-colors ${
                                        activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {activeTab === 'dashboard' && (
                            <>
                                {/* Balance Card */}
                                <div className="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl shadow-xl p-8 mb-6 text-white">
                                    <div className="text-sm opacity-90 mb-2">Current Balance</div>
                                    <div className="text-5xl font-bold mb-4">
                                        ${balance.toFixed(2)}
                                    </div>
                                    <div className="flex flex-wrap gap-x-6 gap-y-2 text-sm">
                                        <div className="flex items-center gap-2">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                                            </svg>
                                            <span>Income: ${totalIncome.toFixed(2)}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
                                            </svg>
                                            <span>Expenses: ${totalExpenses.toFixed(2)}</span>
                                        </div>
                                        {unpaidTotal > 0 && (
                                            <div className="flex items-center gap-2 bg-white/15 px-2 py-0.5 rounded-lg">
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <rect x="2" y="5" width="20" height="14" rx="2" strokeWidth={2} />
                                                    <path strokeLinecap="round" strokeWidth={2} d="M2 10h20" />
                                                </svg>
                                                <span>Unpaid: ${unpaidTotal.toFixed(2)}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Input Section */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                                    <div className="flex gap-3 mb-4">
                                        <button
                                            onClick={() => setTxType('add')}
                                            className={`flex-1 py-2 rounded-lg font-semibold border-2 transition-colors ${
                                                txType === 'add' ? 'bg-green-500 border-green-500 text-white' : 'border-gray-200 text-gray-500'
                                            }`}
                                        >
                                            + Income
                                        </button>
                                        <button
                                            onClick={() => setTxType('subtract')}
                                            className={`flex-1 py-2 rounded-lg font-semibold border-2 transition-colors ${
                                                txType === 'subtract' ? 'bg-red-500 border-red-500 text-white' : 'border-gray-200 text-gray-500'
                                            }`}
                                        >
                                            − Expense
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        <input
                                            type="number"
                                            placeholder="Amount"
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none text-lg"
                                            step="0.01"
                                        />

                                        {txType === 'subtract' && (
                                            <div>
                                                <div className="text-xs font-semibold text-gray-500 mb-2">Category</div>
                                                <div className="space-y-3">
                                                    {CATEGORY_GROUPS.map(group => (
                                                        <div key={group.title}>
                                                            <div className="text-[11px] uppercase tracking-wide font-semibold text-gray-400 mb-1.5">
                                                                {group.title}
                                                            </div>
                                                            <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                                                                {group.items.map(name => {
                                                                    const c = CATEGORY_BY_NAME[name];
                                                                    const selected = category === c.name;
                                                                    return (
                                                                        <button
                                                                            key={c.name}
                                                                            onClick={() => setCategory(c.name)}
                                                                            className="flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl border-2 transition-colors"
                                                                            style={
                                                                                selected
                                                                                    ? { backgroundColor: c.color, borderColor: c.color, color: 'white' }
                                                                                    : { borderColor: '#E5E7EB', color: '#374151', backgroundColor: 'white' }
                                                                            }
                                                                        >
                                                                            <span className="text-xl leading-none">{c.icon}</span>
                                                                            <span className="text-[11px] font-semibold leading-tight text-center">{c.name}</span>
                                                                        </button>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <input
                                            type="text"
                                            placeholder={txType === 'add' ? "Description (e.g., Salary, Bonus)" : "Note (optional)"}
                                            value={description}
                                            onChange={(e) => setDescription(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleTransaction()}
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                        />

                                        <button
                                            onClick={handleTransaction}
                                            className={`w-full py-3 rounded-lg font-semibold text-white transition-colors ${
                                                txType === 'add' ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'
                                            }`}
                                            disabled={syncStatus === 'not-configured'}
                                        >
                                            {txType === 'add' ? 'Add Income' : 'Add Expense'}
                                        </button>
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="flex gap-3 mb-6">
                                    <button
                                        onClick={resetMonth}
                                        className="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-semibold flex items-center justify-center gap-2 transition-colors"
                                        disabled={syncStatus === 'not-configured'}
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                        </svg>
                                        Start New Month
                                    </button>
                                </div>

                                {/* Current Month Transactions */}
                                {transactions.length > 0 && (
                                    <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">This Month's Transactions</h2>
                                        <div className="space-y-2 max-h-96 overflow-y-auto">
                                            {transactions.map((t) => (
                                                <div
                                                    key={t.key}
                                                    className="flex justify-between items-center p-4 bg-gray-50 rounded-lg"
                                                >
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span
                                                                className="text-xs font-semibold px-2 py-0.5 rounded-full text-white"
                                                                style={{ backgroundColor: t.type === 'add' ? INCOME_COLOR : (CATEGORY_COLOR[t.category] || '#6B7280') }}
                                                            >
                                                                {t.type === 'add' ? '💰 Income' : `${CATEGORY_ICON[t.category] || '🔖'} ${t.category || 'Other'}`}
                                                            </span>
                                                            {t.type === 'subtract' && (
                                                                <button
                                                                    onClick={() => togglePaid(t)}
                                                                    className={`text-xs font-semibold px-2 py-0.5 rounded-full border transition-colors ${
                                                                        t.paid
                                                                            ? 'bg-green-50 border-green-400 text-green-700'
                                                                            : 'bg-yellow-50 border-yellow-400 text-yellow-700'
                                                                    }`}
                                                                    title="Click to toggle paid status"
                                                                >
                                                                    {t.paid ? '✓ Paid' : '💳 Unpaid'}
                                                                </button>
                                                            )}
                                                        </div>
                                                        <div className="font-semibold text-gray-800 truncate">{t.description || (t.type === 'add' ? 'Income' : t.category)}</div>
                                                        <div className="text-xs text-gray-500">{t.date}</div>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`text-lg font-bold ${t.type === 'add' ? 'text-green-600' : 'text-red-600'}`}>
                                                            {t.type === 'add' ? '+' : '-'}${t.amount.toFixed(2)}
                                                        </div>
                                                        <button
                                                            onClick={() => deleteTransaction(t.key)}
                                                            className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors"
                                                            title="Delete transaction"
                                                        >
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}

                        {activeTab === 'charts' && (
                            <div className="space-y-6">
                                <PieChart title="This Month — Spending by Category" dataMap={monthCategoryTotals} emptyLabel="No expenses logged this month yet." />
                                <PieChart title="All Time — Spending by Category" dataMap={allTimeCategoryTotals} emptyLabel="No expense history yet." />
                            </div>
                        )}

                        {activeTab === 'archive' && (
                            <>
                                {history.length > 0 ? (
                                    <div className="bg-white rounded-2xl shadow-lg p-6">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">📦 Monthly Archive</h2>
                                        <div className="space-y-4">
                                            {history.map((month) => (
                                                <div key={month.key} className="border-2 border-gray-200 rounded-lg p-4 hover:border-indigo-300 transition-colors">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <div className="font-bold text-lg text-gray-800">{month.month}</div>
                                                        <div className={`text-xl font-bold ${month.finalBalance >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                            ${month.finalBalance.toFixed(2)}
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                                        <div className="text-sm">
                                                            <span className="text-gray-500">Income:</span>
                                                            <span className="font-semibold text-green-600 ml-2">${month.totalIncome.toFixed(2)}</span>
                                                        </div>
                                                        <div className="text-sm">
                                                            <span className="text-gray-500">Expenses:</span>
                                                            <span className="font-semibold text-red-600 ml-2">${month.totalExpenses.toFixed(2)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-xs text-gray-500 mb-3">Archived: {month.resetDate}</div>
                                                    <details className="cursor-pointer">
                                                        <summary className="text-sm text-indigo-600 font-semibold hover:text-indigo-700">
                                                            📋 View {(month.transactions || []).length} transactions
                                                        </summary>
                                                        <div className="mt-3 space-y-2 max-h-64 overflow-y-auto">
                                                            {(month.transactions || []).map((t, i) => (
                                                                <div key={t.key || i} className="flex justify-between text-sm p-2 bg-gray-50 rounded">
                                                                    <div className="flex-1">
                                                                        <span className="text-gray-700 font-medium">{t.description || t.category}</span>
                                                                        <div className="text-xs text-gray-500">{t.date}</div>
                                                                    </div>
                                                                    <span className={`font-semibold ${t.type === 'add' ? 'text-green-600' : 'text-red-600'}`}>
                                                                        {t.type === 'add' ? '+' : '-'}${t.amount.toFixed(2)}
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </details>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-2xl shadow-lg p-12 text-center">
                                        <svg className="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                                        </svg>
                                        <p className="text-gray-500 text-lg font-semibold mb-2">No archived months yet</p>
                                        <p className="text-gray-400 text-sm">Start tracking your expenses, then click "Start New Month" when you're ready to archive this month and begin fresh!</p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BudgetTracker />, document.getElementById('root'));
    </script>
</body>
</html>
