<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwoCents</title>
    <link rel="icon" href="icon-180.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TwoCents">
    <meta name="theme-color" content="#6366F1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyD8bRTk1a4PVsVpPrGmMPwDWh5D9QlKPFY",
          authDomain: "budget-tracker-65260.firebaseapp.com",
          databaseURL: "https://budget-tracker-65260-default-rtdb.firebaseio.com",
          projectId: "budget-tracker-65260",
          storageBucket: "budget-tracker-65260.firebasestorage.app",
          messagingSenderId: "598252496462",
          appId: "1:598252496462:web:4f518d57c5ec905999c51f"
        };

        // Initialize Firebase
        let db = null;
        let auth = null;
        let isFirebaseConfigured = false;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            auth = firebase.auth();
            isFirebaseConfigured = true;
        } catch (error) {
            console.error("Firebase initialization error:", error);
        }

        // ---- Categories ----
        const DEFAULT_CATEGORIES = [
            { name: "Walmart",       color: "#0071CE", icon: "🛒" },
            { name: "Costco",        color: "#E01A2B", icon: "📦" },
            { name: "Other Grocery", color: "#16A34A", icon: "🥦" },
            { name: "Clothing",      color: "#9333EA", icon: "👕" },
            { name: "Beauty",        color: "#78350F", icon: "💄" },
            { name: "Household",     color: "#0D9488", icon: "🧹" },
            { name: "Uber/Transit",  color: "#F59E0B", icon: "🚗" },
            { name: "Rent",          color: "#B45309", icon: "🏠" },
            { name: "Tuition",       color: "#0891B2", icon: "🎓" },
            { name: "Bills",         color: "#DC2626", icon: "🧾" },
            { name: "Fun",           color: "#DB2777", icon: "🎉" },
            { name: "Savings",       color: "#84CC16", icon: "🐷" },
            { name: "Other",         color: "#6B7280", icon: "🔖" },
        ];
        // Lookup tables are refilled from the household's own category list on every render
        const CATEGORY_COLOR = {};
        const CATEGORY_ICON = {};
        const CATEGORY_BY_NAME = {};
        function applyCategories(list) {
            [CATEGORY_COLOR, CATEGORY_ICON, CATEGORY_BY_NAME].forEach(o => Object.keys(o).forEach(k => delete o[k]));
            list.forEach(c => {
                CATEGORY_COLOR[c.name] = c.color;
                CATEGORY_ICON[c.name] = c.icon;
                CATEGORY_BY_NAME[c.name] = c;
            });
        }
        applyCategories(DEFAULT_CATEGORIES);
        const COLOR_CHOICES = ["#0071CE", "#E01A2B", "#16A34A", "#9333EA", "#78350F", "#0D9488", "#F59E0B", "#B45309", "#0891B2", "#DC2626", "#DB2777", "#84CC16", "#6366F1", "#6B7280"];
        const INCOME_COLOR = "#059669";

        function objToArray(obj) {
            if (!obj) return [];
            return Object.entries(obj)
                .map(([key, val]) => ({ ...val, key }))
                .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        }

        // ---- Pie chart (raw Chart.js, no wrapper lib) ----
        function PieChart({ title, dataMap, emptyLabel, onSliceClick }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            const entries = Object.entries(dataMap).filter(([, v]) => v > 0);
            const total = entries.reduce((s, [, v]) => s + v, 0);

            useEffect(() => {
                if (!canvasRef.current) return;
                if (chartRef.current) {
                    chartRef.current.destroy();
                    chartRef.current = null;
                }
                if (entries.length === 0) return;

                chartRef.current = new Chart(canvasRef.current, {
                    type: 'pie',
                    data: {
                        labels: entries.map(([label]) => `${CATEGORY_ICON[label] || '🔖'} ${label}`),
                        datasets: [{
                            data: entries.map(([, v]) => v),
                            backgroundColor: entries.map(([label]) => CATEGORY_COLOR[label] || "#6B7280"),
                            borderWidth: 2,
                            borderColor: "#ffffff",
                        }]
                    },
                    options: {
                        responsive: true,
                        onClick: (evt, elements) => {
                            if (!elements || !elements.length || !onSliceClick) return;
                            const idx = elements[0].index;
                            const label = entries[idx] ? entries[idx][0] : null;
                            if (label) onSliceClick(label);
                        },
                        onHover: (evt, elements) => {
                            if (evt.native && evt.native.target) {
                                evt.native.target.style.cursor = (elements && elements.length && onSliceClick) ? 'pointer' : 'default';
                            }
                        },
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 14, padding: 12, font: { size: 12 } } },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        const val = ctx.raw;
                                        const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                                        return ` ${ctx.label}: $${val.toFixed(2)} (${pct}%)`;
                                    }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                        chartRef.current = null;
                    }
                };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [JSON.stringify(dataMap)]);

            return (
                <div className="bg-white rounded-2xl shadow-lg p-6">
                    <div className="flex justify-between items-baseline mb-4">
                        <h3 className="text-lg font-bold text-gray-800">{title}</h3>
                        <span className="text-sm text-gray-500">Total: ${total.toFixed(2)}</span>
                    </div>
                    {entries.length === 0 ? (
                        <p className="text-gray-400 text-sm text-center py-12">{emptyLabel}</p>
                    ) : (
                        <div className="max-w-xs mx-auto">
                            <canvas ref={canvasRef}></canvas>
                        </div>
                    )}
                    {entries.length > 0 && onSliceClick && (
                        <p className="text-center text-xs text-gray-400 mt-3">Tap a slice to see the transactions</p>
                    )}
                </div>
            );
        }

        // ---- Line chart of category spending across months ----
        function CategoryTrendChart({ points, categories }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            // Only chart categories that have at least one real (tracked) data point above $0
            const activeCategories = categories.filter(c =>
                points.some(p => p.totals && (p.totals[c.name] || 0) > 0)
            );

            useEffect(() => {
                if (!canvasRef.current) return;
                if (chartRef.current) {
                    chartRef.current.destroy();
                    chartRef.current = null;
                }
                if (points.length === 0 || activeCategories.length === 0) return;

                chartRef.current = new Chart(canvasRef.current, {
                    type: 'scatter',
                    data: {
                        datasets: activeCategories.map(c => ({
                            label: `${c.icon} ${c.name}`,
                            // Only plot months we actually have a record for (skip untracked gap months)
                            data: points
                                .map((p, idx) => p.totals ? { x: idx, y: p.totals[c.name] || 0 } : null)
                                .filter(Boolean),
                            backgroundColor: c.color,
                            borderColor: c.color,
                            showLine: true,
                            borderWidth: 1.5,
                            pointRadius: 6,
                            pointHoverRadius: 8,
                            pointStyle: (ctx) => (points[ctx?.raw?.x]?.isCurrent ? 'rectRot' : 'circle'),
                        }))
                    },
                    options: {
                        responsive: true,
                        interaction: { mode: 'nearest', intersect: true },
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 10, font: { size: 11 } } },
                            tooltip: {
                                callbacks: {
                                    title: (items) => {
                                        const idx = items[0]?.raw?.x;
                                        const p = points[idx];
                                        return p ? (p.label + (p.isCurrent ? ' (in progress)' : '')) : '';
                                    },
                                    label: (ctx) => ` ${ctx.dataset.label}: $${ctx.raw.y.toFixed(2)}`
                                }
                            }
                        },
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'linear',
                                min: 0,
                                max: Math.max(points.length - 1, 0),
                                ticks: {
                                    stepSize: 1,
                                    font: { size: 12 },
                                    callback: (val) => {
                                        const p = points[val];
                                        if (!p) return '';
                                        const [month, year] = p.label.split(' ');
                                        return month.slice(0, 3) + " '" + year.slice(2);
                                    }
                                }
                            },
                            y: {
                                beginAtZero: true,
                                ticks: { font: { size: 12 }, callback: (v) => '$' + v }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                        chartRef.current = null;
                    }
                };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [JSON.stringify(points)]);

            if (points.length === 0) {
                return <p className="text-gray-400 text-sm text-center py-8">No months to show yet.</p>;
            }
            if (activeCategories.length === 0) {
                return <p className="text-gray-400 text-sm text-center py-8">No category spending recorded since August 2026 yet.</p>;
            }

            return (
                <div style={{ height: '420px' }}>
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        }

        // ---- Login screen (Google) ----
        function LoginScreen() {
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);

            const signInWithGoogle = async () => {
                setError('');
                setBusy(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
                        try {
                            await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
                            return;
                        } catch (e2) {
                            setError(e2.message);
                        }
                    } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
                        setError(e.message);
                    }
                }
                setBusy(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-lg p-6 w-full max-w-sm space-y-4 text-center">
                        <h1 className="text-2xl font-bold text-gray-800">TwoCents</h1>
                        <p className="text-sm text-gray-500">Starting your finances has never been easier!</p>
                        {error && <p className="text-xs text-red-600 break-words">{error}</p>}
                        <button
                            onClick={signInWithGoogle}
                            disabled={busy}
                            className="w-full py-3 rounded-lg font-semibold text-gray-700 bg-white border-2 border-gray-200 hover:bg-gray-50 flex items-center justify-center gap-2"
                        >
                            <span className="text-lg">🔐</span>
                            {busy ? 'Signing in...' : 'Continue with Google'}
                        </button>
                    </div>
                </div>
            );
        }

        // ---- Shown to people who have no budget yet: start new or join with a code ----
        function WelcomeScreen({ user, onDone }) {
            const [code, setCode] = useState('');
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);

            const startNew = async () => {
                setError('');
                setBusy(true);
                try {
                    const ref = db.ref('households').push();
                    await ref.set({ created: Date.now() });
                    await db.ref('members/' + user.uid).set(ref.key);
                    onDone(ref.key);
                } catch (e) {
                    setError(e.message || String(e));
                    setBusy(false);
                }
            };

            const join = async () => {
                const clean = code.trim();
                if (!clean) { setError('Please paste the code first.'); return; }
                if (/[.#$\[\]\/]/.test(clean)) { setError('That code has characters that are not allowed.'); return; }
                setError('');
                setBusy(true);
                try {
                    await db.ref('members/' + user.uid).set(clean);
                    onDone(clean);
                } catch (e) {
                    setError("Couldn't join. Check the code and try again.");
                    setBusy(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-lg p-6 w-full max-w-sm space-y-4">
                        <h1 className="text-2xl font-bold text-gray-800 text-center">👋 Welcome!</h1>
                        <p className="text-sm text-gray-500 text-center">Signed in as {user.email}</p>

                        <button
                            onClick={startNew}
                            disabled={busy}
                            className="w-full py-3 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700"
                        >
                            ✨ Start my own budget
                        </button>

                        <div className="flex items-center gap-3 text-xs text-gray-400">
                            <div className="flex-1 border-t border-gray-200"></div>
                            <span>or</span>
                            <div className="flex-1 border-t border-gray-200"></div>
                        </div>

                        <div>
                            <p className="text-sm font-semibold text-gray-700 mb-2">Join someone's budget with a code</p>
                            <input
                                type="text"
                                placeholder="Paste the code here"
                                value={code}
                                onChange={(e) => setCode(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && join()}
                                className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                            />
                            <button
                                onClick={join}
                                disabled={busy}
                                className="w-full mt-3 py-3 rounded-lg font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100"
                            >
                                🔗 Join with code
                            </button>
                        </div>

                        {error && <p className="text-xs text-red-600 break-words">{error}</p>}

                        <button onClick={() => auth.signOut()} className="w-full text-xs font-semibold text-gray-500 underline">
                            Log out
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(undefined);   // undefined = still checking
            const [hid, setHid] = useState(undefined);     // undefined = loading, null = no budget yet

            useEffect(() => auth.onAuthStateChanged(u => { setHid(undefined); setUser(u); }), []);

            useEffect(() => {
                if (!user) return;
                db.ref('members/' + user.uid).once('value')
                    .then(snap => setHid(snap.val() || null))
                    .catch(() => setHid(null));
            }, [user]);

            if (user === undefined || (user && hid === undefined)) {
                return <div className="min-h-screen flex items-center justify-center text-gray-600">Loading...</div>;
            }
            if (!user) return <LoginScreen />;
            if (!hid) return <WelcomeScreen user={user} onDone={setHid} />;
            return <BudgetTracker key={hid} user={user} hid={hid} onLeave={() => setHid(null)} />;
        }

        const TABS = [
            { id: 'dashboard', label: '🏠 Dashboard' },
            { id: 'charts', label: '📊 Charts' },
            { id: 'archive', label: '📦 Archive' },
        ];
        const TAB_IDS = TABS.map(t => t.id);

        function BudgetTracker({ user, hid, onLeave }) {
            const base = 'households/' + hid;
            const [activeTab, setActiveTab] = useState('dashboard');
            const touchStartRef = useRef(null);

            const goToTab = (direction) => {
                const idx = TAB_IDS.indexOf(activeTab);
                const nextIdx = idx + direction;
                if (nextIdx >= 0 && nextIdx < TAB_IDS.length) {
                    setActiveTab(TAB_IDS[nextIdx]);
                }
            };

            // Always land at the top of the page when switching tabs, so the
            // bottom tab bar doesn't appear stranded mid-page on shorter tabs.
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [activeTab]);

            // Which category's transaction list is currently open (dashboard-style modal)
            const [categoryDetail, setCategoryDetail] = useState(null); // { scope: 'month' | 'allTime', category: string }

            // Whether the category-trend-by-month chart is expanded
            const [showTrend, setShowTrend] = useState(false);

            // Share dialog
            const [showShare, setShowShare] = useState(false);
            const [copied, setCopied] = useState(false);

            // Custom categories (null = use the defaults)
            const [customCats, setCustomCats] = useState(null);
            const [showCatEditor, setShowCatEditor] = useState(false);
            const [isNewHousehold, setIsNewHousehold] = useState(false);
            const [newCatName, setNewCatName] = useState('');
            const [newCatIcon, setNewCatIcon] = useState('');
            const [newCatColor, setNewCatColor] = useState(COLOR_CHOICES[12]);

            const copyCode = async () => {
                try {
                    await navigator.clipboard.writeText(hid);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) {
                    window.prompt('Copy this code:', hid);
                }
            };

            const leaveBudget = async () => {
                if (!window.confirm('Leave this budget? The data stays safe, but you will need the code to get back in.')) return;
                try {
                    await db.ref('members/' + user.uid).remove();
                    onLeave();
                } catch (error) {
                    alert('Failed to leave: ' + (error.message || error));
                }
            };

            const handleTouchStart = (e) => {
                const t = e.touches[0];
                touchStartRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
            };

            const handleTouchEnd = (e) => {
                if (!touchStartRef.current) return;
                const t = e.changedTouches[0];
                const dx = t.clientX - touchStartRef.current.x;
                const dy = t.clientY - touchStartRef.current.y;
                const elapsed = Date.now() - touchStartRef.current.time;
                touchStartRef.current = null;

                const SWIPE_THRESHOLD = 60;
                const MAX_OFF_AXIS = 80;
                const MAX_TIME = 800;

                if (elapsed > MAX_TIME) return;
                if (Math.abs(dx) < SWIPE_THRESHOLD) return;
                if (Math.abs(dy) > MAX_OFF_AXIS) return;

                if (dx < 0) {
                    goToTab(1); // swipe left -> next tab
                } else {
                    goToTab(-1); // swipe right -> previous tab
                }
            };

            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [txType, setTxType] = useState('subtract'); // 'add' income | 'subtract' expense
            const [category, setCategory] = useState('');

            const [transactions, setTransactions] = useState([]);
            const [history, setHistory] = useState([]);
            const [chartsResetAt, setChartsResetAt] = useState(0);
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('checking');
            const [syncError, setSyncError] = useState('');

            useEffect(() => {
                if (!isFirebaseConfigured) {
                    setSyncStatus('not-configured');
                    setLoading(false);
                    return;
                }
                setupRealtimeListeners();
            }, []);

            const handleDbError = (context) => (error) => {
                console.error(`Firebase error (${context}):`, error);
                setSyncStatus('error');
                setSyncError(error.message || String(error));
                setLoading(false);
            };

            const setupRealtimeListeners = () => {
                setSyncStatus('syncing');

                db.ref(base + '/transactions').on('value', (snapshot) => {
                    setTransactions(objToArray(snapshot.val()));
                    setLoading(false);
                    setSyncStatus('synced');
                    setSyncError('');
                }, handleDbError('loading transactions'));

                db.ref(base + '/history').on('value', (snapshot) => {
                    setHistory(objToArray(snapshot.val()));
                }, handleDbError('loading history'));

                db.ref(base + '/chartsResetAt').on('value', (snapshot) => {
                    setChartsResetAt(snapshot.val() || 0);
                }, handleDbError('loading chart settings'));

                db.ref(base + '/created').on('value', (snapshot) => {
                    setIsNewHousehold(!!snapshot.val());
                }, handleDbError('loading household info'));

                db.ref(base + '/categories').on('value', (snapshot) => {
                    const v = snapshot.val();
                    const list = v ? (Array.isArray(v) ? v : Object.values(v)).filter(Boolean) : [];
                    setCustomCats(list.length > 0 ? list : null);
                }, handleDbError('loading categories'));
            };

            const requireDb = () => {
                if (!isFirebaseConfigured) {
                    alert('Firebase not configured. Please add your Firebase config.');
                    return false;
                }
                return true;
            };

            const handleTransaction = async () => {
                if (!requireDb()) return;
                const value = parseFloat(amount);
                if (!value || value <= 0) {
                    alert('Please enter a valid amount');
                    return;
                }
                if (txType === 'subtract' && !category) {
                    alert('Please pick a category');
                    return;
                }

                const transaction = {
                    type: txType,
                    amount: value,
                    description: description.trim(),
                    category: txType === 'add' ? 'Income' : category,
                    paid: txType === 'subtract' ? false : true,
                    date: new Date().toLocaleString(),
                    timestamp: Date.now(),
                };

                setAmount('');
                setDescription('');
                setCategory('');

                try {
                    setSyncStatus('syncing');
                    await db.ref(base + '/transactions').push(transaction);
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('saving transaction')(error);
                    alert('Failed to save transaction: ' + (error.message || error));
                }
            };

            const deleteTransaction = async (key) => {
                if (!requireDb()) return;
                if (!window.confirm('Delete this transaction?')) return;
                try {
                    setSyncStatus('syncing');
                    await db.ref(base + '/transactions/' + key).remove();
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('deleting transaction')(error);
                    alert('Failed to delete transaction: ' + (error.message || error));
                }
            };

            const togglePaid = async (tx) => {
                if (!requireDb()) return;
                try {
                    setSyncStatus('syncing');
                    await db.ref(base + '/transactions/' + tx.key).update({ paid: !tx.paid });
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('updating paid status')(error);
                    alert('Failed to update: ' + (error.message || error));
                }
            };

            const totalIncome = useMemo(() => transactions.filter(t => t.type === 'add').reduce((s, t) => s + t.amount, 0), [transactions]);
            const totalExpenses = useMemo(() => transactions.filter(t => t.type === 'subtract').reduce((s, t) => s + t.amount, 0), [transactions]);
            const balance = totalIncome - totalExpenses;
            const unpaidTotal = useMemo(
                () => transactions.filter(t => t.type === 'subtract' && !t.paid).reduce((s, t) => s + t.amount, 0),
                [transactions]
            );

            const resetMonth = async () => {
                if (!requireDb()) return;
                if (!window.confirm('Start a new month? This will save all current data to the archive and clear your current transactions.')) return;

                const monthData = {
                    month: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),
                    finalBalance: balance,
                    totalIncome,
                    totalExpenses,
                    transactions: transactions,
                    resetDate: new Date().toLocaleString(),
                    timestamp: Date.now(),
                };

                try {
                    setSyncStatus('syncing');
                    await db.ref(base + '/history').push(monthData);
                    await db.ref(base + '/transactions').remove();
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('archiving month')(error);
                    alert('Failed to start new month — nothing was cleared. Error: ' + (error.message || error));
                }
            };

            // ---- Categories ----
            // Households created in the app start blank; older households keep the original list until edited
            const userCats = customCats || (isNewHousehold ? [] : DEFAULT_CATEGORIES);

            // Also include names that appear in old entries but were removed from the list,
            // so charts and history still show them (in grey).
            const allCategories = useMemo(() => {
                const list = [...userCats];
                const seen = new Set(list.map(c => c.name));
                const addFrom = (t) => {
                    if (t.type !== 'subtract') return;
                    const n = t.category || 'Other';
                    if (!seen.has(n)) {
                        seen.add(n);
                        list.push({ name: n, color: '#6B7280', icon: '🔖' });
                    }
                };
                transactions.forEach(addFrom);
                history.forEach(m => (m.transactions || []).forEach(addFrom));
                return list;
            }, [customCats, transactions, history]);
            applyCategories(allCategories);

            const saveCategories = async (list) => {
                if (!requireDb()) return;
                try {
                    if (list === null) await db.ref(base + '/categories').remove();
                    else await db.ref(base + '/categories').set(list);
                } catch (error) {
                    alert('Failed to save categories: ' + (error.message || error));
                }
            };

            const addCategory = async () => {
                const name = newCatName.trim();
                if (!name) { alert('Please type a name for the category.'); return; }
                if (userCats.some(c => c.name.toLowerCase() === name.toLowerCase())) {
                    alert('You already have a category with that name.');
                    return;
                }
                const icon = newCatIcon.trim() || '🔖';
                await saveCategories([...userCats, { name, icon, color: newCatColor }]);
                setNewCatName('');
                setNewCatIcon('');
            };

            const removeCategory = async (name) => {
                if (userCats.length <= 1 && !isNewHousehold) { alert('You need at least one category.'); return; }
                if (!window.confirm('Remove "' + name + '"? Past entries keep their name and still show in your history and charts.')) return;
                await saveCategories(userCats.filter(c => c.name !== name));
                if (category === name) setCategory('');
            };

            const resetCategories = async () => {
                if (!window.confirm(isNewHousehold
                    ? 'Replace your list with the suggested starter categories? Past entries are not affected.'
                    : 'Go back to the original category list? Past entries are not affected.')) return;
                await saveCategories(isNewHousehold ? DEFAULT_CATEGORIES : null);
            };

            // ---- Chart data ----
            const monthCategoryTotals = useMemo(() => {
                const map = {};
                transactions.filter(t => t.type === 'subtract').forEach(t => {
                    map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
                });
                return map;
            }, [transactions]);

            const allTimeCategoryTotals = useMemo(() => {
                const map = {};
                transactions
                    .filter(t => t.type === 'subtract' && (t.timestamp || 0) >= chartsResetAt)
                    .forEach(t => {
                        map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
                    });
                history.forEach(month => {
                    (month.transactions || [])
                        .filter(t => t.type === 'subtract' && (t.timestamp || 0) >= chartsResetAt)
                        .forEach(t => {
                            map[t.category || 'Other'] = (map[t.category || 'Other'] || 0) + t.amount;
                        });
                });
                return map;
            }, [transactions, history, chartsResetAt]);

            // Transactions to list in the category detail modal
            const categoryDetailTransactions = useMemo(() => {
                if (!categoryDetail) return [];
                const { scope, category: cat } = categoryDetail;

                if (scope === 'month') {
                    return transactions
                        .filter(t => t.type === 'subtract' && (t.category || 'Other') === cat)
                        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }

                const current = transactions
                    .filter(t => t.type === 'subtract' && (t.category || 'Other') === cat && (t.timestamp || 0) >= chartsResetAt)
                    .map(t => ({ ...t, monthLabel: 'This Month' }));
                const past = history.flatMap(month =>
                    (month.transactions || [])
                        .filter(t => t.type === 'subtract' && (t.category || 'Other') === cat && (t.timestamp || 0) >= chartsResetAt)
                        .map(t => ({ ...t, monthLabel: month.month }))
                );
                return [...current, ...past].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            }, [categoryDetail, transactions, history, chartsResetAt]);

            // Per-category spending for every calendar month from Aug 2026 through the current
            // (unarchived) month, so the trend chart always includes "right now" even before a reset.
            const monthlyCategoryTrend = useMemo(() => {
                const monthLabel = (d) => d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

                // Totals for each archived month, keyed by its label
                const byLabel = {};
                history.forEach(month => {
                    const totals = {};
                    (month.transactions || []).forEach(t => {
                        if (t.type === 'subtract') {
                            totals[t.category || 'Other'] = (totals[t.category || 'Other'] || 0) + t.amount;
                        }
                    });
                    byLabel[month.month] = totals;
                });

                // Live, not-yet-archived month always counts as a tracked month (even if $0 so far)
                const now = new Date();
                const currentLabel = monthLabel(now);
                const currentTotals = {};
                transactions.forEach(t => {
                    if (t.type === 'subtract') {
                        currentTotals[t.category || 'Other'] = (currentTotals[t.category || 'Other'] || 0) + t.amount;
                    }
                });
                byLabel[currentLabel] = currentTotals;

                // Walk every calendar month from Aug 2026 through the later of "now" or the
                // latest archived month, so the axis is a real timeline, not just archive count.
                const start = new Date(2026, 7, 1); // August 2026
                let end = new Date(now.getFullYear(), now.getMonth(), 1);
                history.forEach(month => {
                    if (month.timestamp) {
                        const d = new Date(month.timestamp);
                        const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
                        if (monthStart > end) end = monthStart;
                    }
                });

                const points = [];
                let cursor = new Date(start);
                while (cursor <= end) {
                    const label = monthLabel(cursor);
                    points.push({
                        label,
                        isCurrent: label === currentLabel,
                        totals: Object.prototype.hasOwnProperty.call(byLabel, label) ? byLabel[label] : null,
                    });
                    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
                }
                return points;
            }, [history, transactions]);

            const resetAllTimeChart = async () => {
                if (!requireDb()) return;
                if (!window.confirm(
                    "Reset the All-Time chart? This only changes what the chart counts — it will start fresh from today. " +
                    "Your Archive and all past months stay exactly as they are."
                )) return;
                try {
                    setSyncStatus('syncing');
                    await db.ref(base + '/chartsResetAt').set(Date.now());
                    setSyncStatus('synced');
                } catch (error) {
                    handleDbError('resetting chart')(error);
                    alert('Failed to reset chart: ' + (error.message || error));
                }
            };

            const getSyncStatusColor = () => {
                switch (syncStatus) {
                    case 'synced': return 'text-green-600';
                    case 'syncing': return 'text-yellow-600';
                    case 'error': return 'text-red-600';
                    case 'not-configured': return 'text-orange-600';
                    default: return 'text-gray-600';
                }
            };

            const getSyncStatusText = () => {
                switch (syncStatus) {
                    case 'synced': return '✓ Synced';
                    case 'syncing': return '⟳ Syncing...';
                    case 'error': return '⚠ Sync Error';
                    case 'not-configured': return '⚠ Firebase Not Configured';
                    default: return 'Checking...';
                }
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-xl text-gray-600">Loading...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 pb-24">
                    <div
                        className="max-w-2xl mx-auto"
                        onTouchStart={handleTouchStart}
                        onTouchEnd={handleTouchEnd}
                    >
                        {/* Header */}
                        <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                                <svg className="w-8 h-8 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                Little Budget Helper
                            </h1>
                            <div className="flex justify-between items-center">
                                <p className="text-sm text-gray-500">Tracking our finances together 💑</p>
                                <p className={`text-sm font-semibold ${getSyncStatusColor()}`}>
                                    {getSyncStatusText()}
                                </p>
                            </div>
                            <div className="flex gap-4 mt-3">
                                <button onClick={() => setShowShare(true)} className="text-xs font-semibold text-indigo-600 underline">🔗 Share</button>
                                <button onClick={() => auth.signOut()} className="text-xs font-semibold text-gray-500 underline">Log out</button>
                            </div>

                            {syncStatus === 'not-configured' && (
                                <div className="mt-4 p-4 bg-orange-50 border-2 border-orange-200 rounded-lg">
                                    <p className="text-sm text-orange-800 font-semibold mb-2">⚠️ Firebase Configuration Required</p>
                                    <p className="text-xs text-orange-700">
                                        Please replace the Firebase config in the HTML file with your own Firebase project credentials.
                                    </p>
                                </div>
                            )}

                            {syncStatus === 'error' && (
                                <div className="mt-4 p-4 bg-red-50 border-2 border-red-200 rounded-lg">
                                    <p className="text-sm text-red-800 font-semibold mb-1">⚠️ Sync error</p>
                                    <p className="text-xs text-red-700 break-words">{syncError}</p>
                                    <p className="text-xs text-red-700 mt-1">
                                        If this says "permission denied", try logging out and back in. If it keeps happening,
                                        check the Firebase Realtime Database rules.
                                    </p>
                                </div>
                            )}
                        </div>

                        {activeTab === 'dashboard' && (
                            <>
                                {/* Balance Card */}
                                <div className="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl shadow-xl p-8 mb-6 text-white">
                                    <div className="text-sm opacity-90 mb-2">Current Balance</div>
                                    <div className="text-5xl font-bold mb-4">
                                        ${balance.toFixed(2)}
                                    </div>
                                    <div className="flex flex-wrap gap-x-6 gap-y-2 text-sm">
                                        <div className="flex items-center gap-2">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                                            </svg>
                                            <span>Income: ${totalIncome.toFixed(2)}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
                                            </svg>
                                            <span>Expenses: ${totalExpenses.toFixed(2)}</span>
                                        </div>
                                        {unpaidTotal > 0 && (
                                            <div className="flex items-center gap-2 bg-white/15 px-2 py-0.5 rounded-lg">
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <rect x="2" y="5" width="20" height="14" rx="2" strokeWidth={2} />
                                                    <path strokeLinecap="round" strokeWidth={2} d="M2 10h20" />
                                                </svg>
                                                <span>Unpaid: ${unpaidTotal.toFixed(2)}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Input Section */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                                    <div className="flex gap-3 mb-4">
                                        <button
                                            onClick={() => setTxType('add')}
                                            className={`flex-1 py-2 rounded-lg font-semibold border-2 transition-colors ${
                                                txType === 'add' ? 'bg-green-500 border-green-500 text-white' : 'border-gray-200 text-gray-500'
                                            }`}
                                        >
                                            + Income
                                        </button>
                                        <button
                                            onClick={() => setTxType('subtract')}
                                            className={`flex-1 py-2 rounded-lg font-semibold border-2 transition-colors ${
                                                txType === 'subtract' ? 'bg-red-500 border-red-500 text-white' : 'border-gray-200 text-gray-500'
                                            }`}
                                        >
                                            − Expense
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        <input
                                            type="number"
                                            placeholder="Amount"
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none text-lg"
                                            step="0.01"
                                        />

                                        {txType === 'subtract' && (
                                            <div>
                                                <div className="flex justify-between items-center mb-2">
                                                    <div className="text-xs font-semibold text-gray-500">Category</div>
                                                    <button
                                                        onClick={() => setShowCatEditor(true)}
                                                        className="text-xs font-semibold text-indigo-600 underline"
                                                    >
                                                        ✏️ Edit categories
                                                    </button>
                                                </div>
                                                {userCats.length === 0 && (
                                                    <div className="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center space-y-3">
                                                        <p className="text-sm text-gray-500">No categories yet. Add your own, or start from a suggested list.</p>
                                                        <div className="flex gap-2">
                                                            <button
                                                                onClick={() => setShowCatEditor(true)}
                                                                className="flex-1 py-2 rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700"
                                                            >
                                                                ➕ Add my own
                                                            </button>
                                                            <button
                                                                onClick={() => saveCategories(DEFAULT_CATEGORIES)}
                                                                className="flex-1 py-2 rounded-lg text-sm font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100"
                                                            >
                                                                📋 Use suggestions
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                                <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                                                    {userCats.map(c => {
                                                        const selected = category === c.name;
                                                        return (
                                                            <button
                                                                key={c.name}
                                                                onClick={() => setCategory(c.name)}
                                                                className="flex flex-col items-center justify-center gap-1 py-2.5 px-1 rounded-xl border-2 transition-colors"
                                                                style={
                                                                    selected
                                                                        ? { backgroundColor: c.color, borderColor: c.color, color: 'white' }
                                                                        : { borderColor: '#E5E7EB', color: '#374151', backgroundColor: 'white' }
                                                                }
                                                            >
                                                                <span className="text-xl leading-none">{c.icon}</span>
                                                                <span className="text-[11px] font-semibold leading-tight text-center">{c.name}</span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        <input
                                            type="text"
                                            placeholder={txType === 'add' ? "Description (e.g., Salary, Bonus)" : "Note (optional)"}
                                            value={description}
                                            onChange={(e) => setDescription(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleTransaction()}
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                        />

                                        <button
                                            onClick={handleTransaction}
                                            className={`w-full py-3 rounded-lg font-semibold text-white transition-colors ${
                                                txType === 'add' ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'
                                            }`}
                                            disabled={syncStatus === 'not-configured'}
                                        >
                                            {txType === 'add' ? 'Add Income' : 'Add Expense'}
                                        </button>
                                    </div>
                                </div>

                                {/* Action Buttons */}
                                <div className="flex gap-3 mb-6">
                                    <button
                                        onClick={resetMonth}
                                        className="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-semibold flex items-center justify-center gap-2 transition-colors"
                                        disabled={syncStatus === 'not-configured'}
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                        </svg>
                                        Start New Month
                                    </button>
                                </div>

                                {/* Current Month Transactions */}
                                {transactions.length > 0 && (
                                    <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">This Month's Transactions</h2>
                                        <div className="space-y-2 max-h-96 overflow-y-auto">
                                            {transactions.map((t) => (
                                                <div
                                                    key={t.key}
                                                    className="flex justify-between items-center p-4 bg-gray-50 rounded-lg"
                                                >
                                                    <div className="flex-1 min-w-0">
                                                        <div className="flex items-center gap-2 flex-wrap">
                                                            <span
                                                                className="text-xs font-semibold px-2 py-0.5 rounded-full text-white"
                                                                style={{ backgroundColor: t.type === 'add' ? INCOME_COLOR : (CATEGORY_COLOR[t.category] || '#6B7280') }}
                                                            >
                                                                {t.type === 'add' ? '💰 Income' : `${CATEGORY_ICON[t.category] || '🔖'} ${t.category || 'Other'}`}
                                                            </span>
                                                            {t.type === 'subtract' && (
                                                                <button
                                                                    onClick={() => togglePaid(t)}
                                                                    className={`text-xs font-semibold px-2 py-0.5 rounded-full border transition-colors ${
                                                                        t.paid
                                                                            ? 'bg-green-50 border-green-400 text-green-700'
                                                                            : 'bg-yellow-50 border-yellow-400 text-yellow-700'
                                                                    }`}
                                                                    title="Click to toggle paid status"
                                                                >
                                                                    {t.paid ? '✓ Paid' : '💳 Unpaid'}
                                                                </button>
                                                            )}
                                                        </div>
                                                        <div className="font-semibold text-gray-800 truncate">{t.description || (t.type === 'add' ? 'Income' : t.category)}</div>
                                                        <div className="text-xs text-gray-500">{t.date}</div>
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`text-lg font-bold ${t.type === 'add' ? 'text-green-600' : 'text-red-600'}`}>
                                                            {t.type === 'add' ? '+' : '-'}${t.amount.toFixed(2)}
                                                        </div>
                                                        <button
                                                            onClick={() => deleteTransaction(t.key)}
                                                            className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors"
                                                            title="Delete transaction"
                                                        >
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </>
                        )}

                        {activeTab === 'charts' && (
                            <div className="space-y-6">
                                <PieChart
                                    title="This Month — Spending by Category"
                                    dataMap={monthCategoryTotals}
                                    emptyLabel="No expenses logged this month yet."
                                    onSliceClick={(cat) => setCategoryDetail({ scope: 'month', category: cat })}
                                />

                                <div>
                                    <PieChart
                                        title="All Time — Spending by Category"
                                        dataMap={allTimeCategoryTotals}
                                        emptyLabel="No expense history yet."
                                        onSliceClick={(cat) => setCategoryDetail({ scope: 'allTime', category: cat })}
                                    />
                                    <div className="flex items-center justify-between mt-3 px-1">
                                        <p className="text-xs text-gray-500">
                                            {chartsResetAt > 0
                                                ? `Tracking since ${new Date(chartsResetAt).toLocaleDateString()}`
                                                : 'Tracking everything since the beginning'}
                                        </p>
                                        <button
                                            onClick={resetAllTimeChart}
                                            className="text-xs font-semibold text-red-600 hover:text-red-700 px-3 py-1.5 rounded-lg border border-red-200 hover:bg-red-50 transition-colors"
                                            disabled={syncStatus === 'not-configured'}
                                        >
                                            ↺ Reset All-Time Chart
                                        </button>
                                    </div>
                                </div>

                                {/* Category trend across months — collapsed by default to avoid clutter */}
                                <div className="bg-white rounded-2xl shadow-lg p-6">
                                    <button
                                        onClick={() => setShowTrend(v => !v)}
                                        className="w-full flex justify-between items-center"
                                    >
                                        <div className="text-left">
                                            <h3 className="text-lg font-bold text-gray-800">📈 Category Trends by Month</h3>
                                            <p className="text-xs text-gray-500 mt-0.5">Compare each category across the months you've archived</p>
                                        </div>
                                        <span className="text-gray-400 text-2xl leading-none ml-3">{showTrend ? '−' : '+'}</span>
                                    </button>
                                    {showTrend && (
                                        <div className="mt-4">
                                            <CategoryTrendChart points={monthlyCategoryTrend} categories={allCategories} />
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'archive' && (
                            <>
                                {history.length > 0 ? (
                                    <div className="bg-white rounded-2xl shadow-lg p-6">
                                        <h2 className="text-xl font-bold text-gray-800 mb-4">📦 Monthly Archive</h2>
                                        <div className="space-y-4">
                                            {history.map((month) => (
                                                <div key={month.key} className="border-2 border-gray-200 rounded-lg p-4 hover:border-indigo-300 transition-colors">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <div className="font-bold text-lg text-gray-800">{month.month}</div>
                                                        <div className={`text-xl font-bold ${month.finalBalance >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                            ${month.finalBalance.toFixed(2)}
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                                        <div className="text-sm">
                                                            <span className="text-gray-500">Income:</span>
                                                            <span className="font-semibold text-green-600 ml-2">${month.totalIncome.toFixed(2)}</span>
                                                        </div>
                                                        <div className="text-sm">
                                                            <span className="text-gray-500">Expenses:</span>
                                                            <span className="font-semibold text-red-600 ml-2">${month.totalExpenses.toFixed(2)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-xs text-gray-500 mb-3">Archived: {month.resetDate}</div>
                                                    <details className="cursor-pointer">
                                                        <summary className="text-sm text-indigo-600 font-semibold hover:text-indigo-700">
                                                            📋 View {(month.transactions || []).length} transactions
                                                        </summary>
                                                        <div className="mt-3 space-y-2 max-h-64 overflow-y-auto">
                                                            {(month.transactions || []).map((t, i) => (
                                                                <div key={t.key || i} className="flex justify-between text-sm p-2 bg-gray-50 rounded">
                                                                    <div className="flex-1">
                                                                        <span className="text-gray-700 font-medium">{t.description || t.category}</span>
                                                                        <div className="text-xs text-gray-500">{t.date}</div>
                                                                    </div>
                                                                    <span className={`font-semibold ${t.type === 'add' ? 'text-green-600' : 'text-red-600'}`}>
                                                                        {t.type === 'add' ? '+' : '-'}${t.amount.toFixed(2)}
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </details>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-2xl shadow-lg p-12 text-center">
                                        <svg className="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                                        </svg>
                                        <p className="text-gray-500 text-lg font-semibold mb-2">No archived months yet</p>
                                        <p className="text-gray-400 text-sm">Start tracking your expenses, then click "Start New Month" when you're ready to archive this month and begin fresh!</p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>

                    {/* Category Editor Modal */}
                    {showCatEditor && (
                        <div
                            className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-40 p-4"
                            onClick={() => setShowCatEditor(false)}
                        >
                            <div
                                className="bg-white rounded-2xl shadow-xl max-w-md w-full max-h-[85vh] flex flex-col"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center p-4 border-b border-gray-100">
                                    <h3 className="font-bold text-lg text-gray-800">✏️ Your categories</h3>
                                    <button
                                        onClick={() => setShowCatEditor(false)}
                                        className="text-gray-400 hover:text-gray-600 text-2xl leading-none px-2"
                                    >
                                        ×
                                    </button>
                                </div>

                                <div className="overflow-y-auto p-4 space-y-2">
                                    {userCats.length === 0 && (
                                        <p className="text-sm text-gray-400 text-center py-4">No categories yet. Add your first one below.</p>
                                    )}
                                    {userCats.map(c => (
                                        <div key={c.name} className="flex items-center gap-3 p-2 bg-gray-50 rounded-lg">
                                            <span
                                                className="w-8 h-8 rounded-full flex items-center justify-center text-base flex-shrink-0"
                                                style={{ backgroundColor: c.color }}
                                            >
                                                {c.icon}
                                            </span>
                                            <span className="flex-1 min-w-0 truncate font-semibold text-gray-800 text-sm">{c.name}</span>
                                            <button
                                                onClick={() => removeCategory(c.name)}
                                                className="text-red-500 hover:bg-red-50 rounded-lg px-2 py-1 text-sm font-semibold"
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="p-4 border-t border-gray-100 space-y-3">
                                    <div className="text-xs font-semibold text-gray-500">Add a new category</div>
                                    <div className="flex gap-2">
                                        <input
                                            type="text"
                                            placeholder="🙂"
                                            value={newCatIcon}
                                            onChange={(e) => setNewCatIcon(e.target.value)}
                                            maxLength={4}
                                            className="w-16 px-2 py-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none text-center text-lg"
                                        />
                                        <input
                                            type="text"
                                            placeholder="Name (e.g., Pets)"
                                            value={newCatName}
                                            onChange={(e) => setNewCatName(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && addCategory()}
                                            maxLength={20}
                                            className="flex-1 min-w-0 px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-indigo-500 focus:outline-none"
                                        />
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {COLOR_CHOICES.map(col => (
                                            <button
                                                key={col}
                                                onClick={() => setNewCatColor(col)}
                                                className="w-7 h-7 rounded-full border-2"
                                                style={{ backgroundColor: col, borderColor: newCatColor === col ? '#111827' : 'transparent' }}
                                                title={col}
                                            />
                                        ))}
                                    </div>
                                    <button
                                        onClick={addCategory}
                                        className="w-full py-3 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700"
                                    >
                                        + Add category
                                    </button>
                                    <div className="flex justify-between pt-1">
                                        <button onClick={resetCategories} className="text-xs font-semibold text-gray-500 underline">{isNewHousehold ? 'Use suggested starter list' : 'Reset to original list'}</button>
                                        <button onClick={() => setShowCatEditor(false)} className="text-xs font-semibold text-gray-500 underline">Done</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Share Modal */}
                    {showShare && (
                        <div
                            className="fixed inset-0 bg-black/50 flex items-center justify-center z-40 p-4"
                            onClick={() => setShowShare(false)}
                        >
                            <div
                                className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <h3 className="font-bold text-lg text-gray-800">🔗 Share this budget</h3>
                                <p className="text-sm text-gray-600">
                                    Send this code to your partner. They sign in with Google, choose "Join with code," and paste it.
                                    Anyone with the code can see and edit this budget, so only share it with people you trust.
                                </p>
                                <div className="bg-gray-100 rounded-lg p-3 text-sm font-mono break-all text-gray-800 select-all">{hid}</div>
                                <button
                                    onClick={copyCode}
                                    className="w-full py-3 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700"
                                >
                                    {copied ? '✓ Copied!' : 'Copy code'}
                                </button>
                                <div className="flex justify-between pt-1">
                                    <button onClick={leaveBudget} className="text-xs font-semibold text-red-600 underline">Leave this budget</button>
                                    <button onClick={() => setShowShare(false)} className="text-xs font-semibold text-gray-500 underline">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Category Detail Modal */}
                    {categoryDetail && (
                        <div
                            className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-30 p-4"
                            onClick={() => setCategoryDetail(null)}
                        >
                            <div
                                className="bg-white rounded-2xl shadow-xl max-w-md w-full max-h-[80vh] flex flex-col"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="flex justify-between items-center p-4 border-b border-gray-100">
                                    <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2 min-w-0">
